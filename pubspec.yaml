name: mgl_notes_app
description: Amjil Notes - vertical Mongolian notes app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mongol: ^9.2.1
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.3.3
  drift: ^2.30.1
  sqlite3_flutter_libs: ^0.5.41
  mgl_editor_core:
    path: ../mgl-richtext-editor/packages/mgl_editor_core
  mongol_code: ^1.0.5
  archive: ^4.0.9
  http: ^1.2.2
  vibration: ^3.1.5
  url_launcher: ^6.3.2
  uuid: ^4.5.2
  html: ^0.15.6
  file_picker: ^12.0.0
  crypto: ^3.0.6
  flutter_styled_toast: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.30.1
  build_runner: ^2.10.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  adaptive_icon_background: "#1A7AB3"
  adaptive_icon_foreground: assets/icon/app_icon.png
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#1A7AB3"
    theme_color: "#1A7AB3"
  windows:
    generate: true
    image_path: assets/icon/app_icon_windows.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/app_icon_macos.png

dependency_overrides:
  # 13.x uses isiOSAppOnVision, which Xcode 14 / iOS 16 SDK does not have.
  device_info_plus: 12.2.0

# Use sqlite3_flutter_libs' bundled lib instead of downloading GitHub
# native assets (that download fails on this machine).
# `system` → dlopen libsqlite3.so / sqlite3.dll / libsqlite3.dylib.
# Do NOT use `process` on Android: libsqlite3.so is in the APK but not
# auto-loaded, so @Native fails with "No asset with id" / missing
# sqlite3_initialize.
hooks:
  user_defines:
    sqlite3:
      source: system
      name: sqlite3

flutter:
  uses-material-design: true

  assets:
    - assets/next.zip
    - assets/fst/dict.bin
    - assets/fst/dict.idx
    - assets/fst/keys.json
    - assets/fst/lists.bin
    - assets/fst/lists.idx
    - assets/fst/words.fst
    - assets/fst/token_table.bin
    - assets/fonts/OyunQaganTig.ttf
    - assets/fonts/OnonSoninSans.ttf

  fonts:
    - family: OyunQaganTig
      fonts:
        - asset: assets/fonts/OyunQaganTig.ttf
